# Jupyter Book 2 (MyST) configuration. See https://mystmd.org/guide/frontmatter
version: 1
project:
  title: Курс по КМО
  description: >-
    An adaptive and practical course about Quantum Machine Learning in the NISQ-era and related topics.
  authors:
    - name: Квантовое сообщество ODS
  copyright: "2021 - с.г."
  license: CC-BY-4.0
  github: https://github.com/quantum-ods/qmlcourse
  bibliography:
    - _bibliography/references.bib
  exclude:
    - _build/**
    - "**/*.md~"
  settings:
    # warnings from libraries (deprecations etc.) are noise for readers
    output_stderr: remove
  toc:
    - file: book/index.md
    - title: Введение
      children:
        - file: book/intro/ru/intro.md
          title: 🟦 О квантовых компьютерах
        - file: book/intro/ru/prerequisite.md
          title: ⬜ Пререквизиты курса
    - title: Основы Python
      children:
        - file: book/python/ru/python_intro.md
          title: ⬜ О блоке
    - title: Линейная алгебра и numpy
      children:
        - file: book/linalg/ru/linalg_intro.md
          title: ⬜ О блоке
        - file: book/linalg/ru/vectors.md
          title: 🟦 Векторы
        - file: book/linalg/ru/bra-ket.md
          title: 🟦 Нотация Дирака
        - file: book/linalg/ru/matrices.md
          title: 🟦 Матрицы
        - file: book/linalg/ru/numpy.md
