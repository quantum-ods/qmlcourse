[project]
name = "qmlcourse"
version = "3.0.0"
description = "An adaptive and practical course about Quantum Machine Learning (ODS Quantum community)"
authors = [{ name = "Quantum Machine Learning Community Course", email = "qmlcourse.ods@gmail.com" }]
license = "CC-BY-4.0"
readme = "readme.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # book toolchain
    "jupyter-book>=2.1",
    "ipykernel",
    # libraries used in lecture code cells
    "matplotlib",
    "networkx",
    "netket",
    "numpy",
    "pennylane",
    "pyberny",
    "pylatexenc",
    "pyscf",
    "qiskit",
    "qiskit-aer",
    "scikit-learn",
    "scipy",
    "sympy",
    # classical head of the quantum convolution lecture (qnn/qconv), JAX backend
    "keras>=3",
]

[tool.uv]
package = false
